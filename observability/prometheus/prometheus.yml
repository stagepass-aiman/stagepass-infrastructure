# =============================================================================
# prometheus.yml — Prometheus scrape configuration
#
# WHY PRE-DEFINED TARGETS FOR NON-EXISTENT SERVICES:
#   NFR-OBS-002: all services expose /metrics in Prometheus format.
#   The DoD for Phase 2 requires that Prometheus scrape targets are defined
#   for all services and that the config is valid — even though services
#   don't exist yet. Prometheus gracefully marks unreachable targets as DOWN
#   and retries; it does not fail to start. When Phase 3 brings Auth and
#   Event services up, they are automatically scraped with no config change.
#   This is the correct operational model: the scrape config is infrastructure,
#   not per-service config.
#
# SCRAPE INTERVALS:
#   - Infrastructure (DB, Kafka, etc.): 30s — slow-changing capacity metrics
#   - Application services: 15s — RED metrics require more granularity
#   - Observability stack: 15s — self-monitoring
#
# ALL SERVICES ARE EXPECTED TO EXPOSE /metrics (or /actuator/prometheus for
# Spring Boot services — configured via management.endpoints.web.exposure).
#
# CHANGELOG:
#   Phase 4 — Corrected venue-service port from placeholder 3000 → 8083.
#             Port 8083 is authoritative from venue.yaml (RULE-17).
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: "local"
    platform: "stagepass"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: /metrics

  - job_name: "postgres-auth"
    static_configs:
      - targets: ["postgres-exporter-auth:9187"]
        labels:
          service: "auth"
          db: "auth_db"

  - job_name: "postgres-seat-inventory"
    static_configs:
      - targets: ["postgres-exporter-seat:9187"]
        labels:
          service: "seat-inventory"
          db: "seat_inventory_db"

  - job_name: "postgres-booking"
    static_configs:
      - targets: ["postgres-exporter-booking:9187"]
        labels:
          service: "booking"
          db: "booking_write_db"

  - job_name: "postgres-payment"
    static_configs:
      - targets: ["postgres-exporter-payment:9187"]
        labels:
          service: "payment"
          db: "payment_db"

  - job_name: "postgres-disbursement"
    static_configs:
      - targets: ["postgres-exporter-disbursement:9187"]
        labels:
          service: "disbursement"
          db: "disbursement_db"

  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels:
          component: "mongodb"

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          component: "redis"

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          component: "kafka"

  - job_name: "elasticsearch"
    static_configs:
      - targets: ["elasticsearch-exporter:9114"]
        labels:
          component: "elasticsearch"

  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels:
          component: "minio"

  # ── T1 services (Phase 3+) ─────────────────────────────────────────────────
  - job_name: "auth-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]
        labels:
          service: "auth"
          tier: "t1"

  - job_name: "seat-inventory-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["seat-inventory-service:8081"]
        labels:
          service: "seat-inventory"
          tier: "t1"

  - job_name: "booking-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["booking-service:8081"]
        labels:
          service: "booking"
          tier: "t1"

  - job_name: "payment-service"
    metrics_path: /q/metrics
    static_configs:
      - targets: ["payment-service:8081"]
        labels:
          service: "payment"
          tier: "t1"

  - job_name: "disbursement-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["disbursement-service:8081"]
        labels:
          service: "disbursement"
          tier: "t1"

  # ── T2 services (Phase 3-4+) ───────────────────────────────────────────────
  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8081"]
        labels:
          service: "api-gateway"
          tier: "t2"

  - job_name: "event-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["event-service:8082"]
        labels:
          service: "event"
          tier: "t2"

  # RULE-17: port cross-checked against venue.yaml (authoritative source).
  # Phase 2 placeholder was 3000 — corrected to 8083 in Phase 4.
  - job_name: "venue-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["venue-service:8083"]
        labels:
          service: "venue"
          tier: "t2"

  - job_name: "ticket-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ticket-service:3001"]
        labels:
          service: "ticket"
          tier: "t2"

  - job_name: "check-in-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["check-in-service:3001"]
        labels:
          service: "check-in"
          tier: "t2"

  - job_name: "notification-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:3002"]
        labels:
          service: "notification"
          tier: "t2"

  - job_name: "search-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["search-service:8000"]
        labels:
          service: "search"
          tier: "t2"

  # ── T3 services (Phase 4-5+) ───────────────────────────────────────────────
  - job_name: "waitlist-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["waitlist-service:3000"]
        labels:
          service: "waitlist"
          tier: "t3"

  - job_name: "recommendation-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["recommendation-service:8000"]
        labels:
          service: "recommendation"
          tier: "t3"

  - job_name: "chatbot-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["chatbot-service:8000"]
        labels:
          service: "chatbot"
          tier: "t3"

  - job_name: "fraud-detection-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["fraud-detection-service:8000"]
        labels:
          service: "fraud-detection"
          tier: "t3"

  - job_name: "analytics-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics-service:8000"]
        labels:
          service: "analytics"
          tier: "t3"
