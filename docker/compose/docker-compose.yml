# =============================================================================
# docker-compose.yml — StagePass Local Infrastructure Stack
#
# Repo:    stagepass-infrastructure
# Path:    /docker/compose/docker-compose.yml
# Version: 0.1.0
# Status:  Phase 2 — Local Infrastructure Bootstrap
#
# PROFILES:
#   --profile infra       All infrastructure services (default for development)
#   --profile ci          SonarQube (on-demand quality analysis — NOT in infra)
#
# WHY SONARQUBE IS NOT IN --profile infra:
#   SonarQube requires ~1.2–1.5 GB RAM. NFR-PERF-043 caps the full stack
#   (17 services + infra) at 12 GB. Running SonarQube alongside all Phase 4
#   services leaves < 500 MB headroom — below safe operating margin.
#   SonarQube runs on-demand during CI analysis, not as a persistent dev service.
#   This matches real-world usage: SonarQube runs on a dedicated CI server, not
#   developer laptops.
#
# DATABASE ISOLATION MODEL:
#   - PostgreSQL: one container, 8 per-service databases.
#     Isolation enforced by per-service PostgreSQL users with CONNECT granted
#     only to their own database. Cross-database access requires postgres
#     superuser credentials — never issued to any service.
#   - MongoDB: one container, 3 per-service databases.
#     Isolation enforced by MongoDB createUser with db-scoped readWrite role.
#   - Redis: one container, 7 logical databases (SELECT 0–6).
#     ⚠️ IMPORTANT: Redis logical databases share the same password and memory.
#     This is NOT a security boundary — it is organisational separation for
#     local dev only. Production uses separate Redis clusters per purpose.
#     Services know only their own DB index (injected via Vault secret).
#
# KAFKA SECURITY — THR-PLAT-01 (STRIDE §8) PHASE 2 GATE BLOCKER:
#   SASL/SCRAM-SHA-512 is configured on the broker.
#   Per-service SCRAM credentials and topic ACLs are provisioned by
#   kafka-init after the broker is healthy.
#   Without this, any pod in the cluster can inject arbitrary Kafka events,
#   including fraudulent payment.events that would trigger booking confirmation
#   without actual payment.
#
# SECRETS:
#   All passwords are read from environment variables, which in turn are sourced
#   from .env.local (gitignored). In Phase 9, Vault Agent Injector replaces
#   .env.local entirely. Never commit .env.local.
#   See .env.local.example for required variable names.
#
# MEMORY BUDGET (NFR-PERF-043 — hard ceiling: 12 GB):
#   Infra-only (Phase 2, no services): ~4.2 GB
#   Phase 3 (+6 services):             ~7.0 GB
#   Phase 4 (+12 services total):      ~9.5 GB
#   Phase 5 (+17 services total):     ~11.3 GB
#   Verified by: scripts/check-memory.sh
#
# USAGE:
#   # Start all infrastructure
#   docker compose --profile infra up -d
#
#   # Start SonarQube for a quality scan
#   docker compose --profile ci up -d sonarqube
#
#   # Verify health
#   docker compose --profile infra ps
#
#   # Check RAM usage
#   ./scripts/check-memory.sh
# =============================================================================

name: stagepass

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  # Primary application network — all services attach here
  stagepass-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

  # Observability network — isolated from application traffic
  # Prometheus, Grafana, Loki, Jaeger communicate here without
  # reaching application databases directly
  observability-net:
    driver: bridge

# =============================================================================
# VOLUMES — named volumes ensure data survives container restarts
# Deleted only by: docker compose down -v (explicit intent required)
# =============================================================================
volumes:
  postgres-data:
    name: stagepass_postgres_data
  mongodb-data:
    name: stagepass_mongodb_data
  redis-data:
    name: stagepass_redis_data
  kafka-data:
    name: stagepass_kafka_data
  zookeeper-data:
    name: stagepass_zookeeper_data
  zookeeper-log:
    name: stagepass_zookeeper_log
  elasticsearch-data:
    name: stagepass_elasticsearch_data
  clickhouse-data:
    name: stagepass_clickhouse_data
  qdrant-data:
    name: stagepass_qdrant_data
  minio-data:
    name: stagepass_minio_data
  vault-data:
    name: stagepass_vault_data
  prometheus-data:
    name: stagepass_prometheus_data
  grafana-data:
    name: stagepass_grafana_data
  loki-data:
    name: stagepass_loki_data
  sonarqube-data:
    name: stagepass_sonarqube_data
  sonarqube-logs:
    name: stagepass_sonarqube_logs
  sonarqube-extensions:
    name: stagepass_sonarqube_extensions
  sonarqube-postgres-data:
    name: stagepass_sonarqube_postgres_data

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ===========================================================================
  # POSTGRESQL — shared container, 8 per-service databases
  # Image: postgres:16-alpine (smaller footprint than debian variant)
  # Memory: 512 MB (NFR §5.4)
  # Init: /docker-entrypoint-initdb.d/ scripts run once on first start
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: stagepass-postgres
    restart: unless-stopped
    profiles: [infra]
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB:       postgres
      # Per-service passwords — injected from .env.local, come from Vault in Phase 9
      POSTGRES_AUTH_PASSWORD:         ${POSTGRES_AUTH_PASSWORD}
      POSTGRES_SEAT_PASSWORD:         ${POSTGRES_SEAT_PASSWORD}
      POSTGRES_BOOKING_PASSWORD:      ${POSTGRES_BOOKING_PASSWORD}
      POSTGRES_PAYMENT_PASSWORD:      ${POSTGRES_PAYMENT_PASSWORD}
      POSTGRES_DISBURSEMENT_PASSWORD: ${POSTGRES_DISBURSEMENT_PASSWORD}
      POSTGRES_TICKET_PASSWORD:       ${POSTGRES_TICKET_PASSWORD}
      POSTGRES_CHECKIN_PASSWORD:      ${POSTGRES_CHECKIN_PASSWORD}
      POSTGRES_FRAUD_PASSWORD:        ${POSTGRES_FRAUD_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Init scripts run in alphabetical order on first start
      - ./init/postgres/01-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    ports:
      - "5432:5432"
    networks:
      - stagepass-net
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 30s
    # Run as postgres user (uid 999 in the official image) — non-root
    # The postgres image already enforces this; no user: override needed.

  # ===========================================================================
  # MONGODB — shared container, 3 per-service databases
  # Memory: 512 MB (NFR §5.4)
  # ===========================================================================
  mongodb:
    image: mongo:7.0
    container_name: stagepass-mongodb
    restart: unless-stopped
    profiles: [infra]
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      # Per-service passwords for init script
      MONGO_EVENT_PASSWORD:        ${MONGO_EVENT_PASSWORD}
      MONGO_VENUE_PASSWORD:        ${MONGO_VENUE_PASSWORD}
      MONGO_BOOKING_READ_PASSWORD: ${MONGO_BOOKING_READ_PASSWORD}
    volumes:
      - mongodb-data:/data/db
      - ./init/mongo/01-init-databases.js:/docker-entrypoint-initdb.d/01-init-databases.js:ro
    ports:
      - "27017:27017"
    networks:
      - stagepass-net
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test:     ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 30s
    # MongoDB 7.0 official image runs as mongodb user (uid 999) — non-root ✓
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # REDIS — shared container, 7 logical databases (SELECT 0–6)
  #
  # REDIS LOGICAL DATABASE ASSIGNMENTS:
  #   DB 0: auth-cache      — JTI blocklist (sorted set + TTL), rate-limit counters
  #   DB 1: seat-hold-cache — SETNX seat holds (NFR-REL-004: 10-min TTL)
  #   DB 2: gateway-cache   — API Gateway rate-limit sliding window counters
  #   DB 3: notification    — Socket.IO Redis adapter (pub/sub + room membership)
  #   DB 4: waitlist-store  — sorted sets per eventId (ZADD/ZPOPMIN)
  #   DB 5: recommendation  — inference output cache (5-min TTL per user)
  #   DB 6: chatbot-cache   — conversation memory (last N turns per session)
  #
  # ⚠️  PRODUCTION DIVERGENCE: Redis logical databases share the same process
  # and auth password. In production, each purpose maps to a separate
  # ElastiCache cluster with separate credentials and VPC security groups.
  # This is acceptable for Phase 2–9 local development.
  # Memory: 256 MB total for all 7 logical databases (NFR §5.4)
  # ===========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: stagepass-redis
    restart: unless-stopped
    profiles: [infra]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 220mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - stagepass-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    # Redis alpine image runs as redis user (uid 999) — non-root ✓
    user: "999:999"
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # ZOOKEEPER — required by Kafka (classic mode)
  # Memory: 128 MB
  # NOTE: Kafka KRaft (no ZooKeeper) is the modern approach but bitnami/kafka's
  # SASL/SCRAM support is more mature and better documented in ZooKeeper mode.
  # KRaft + SASL/SCRAM migration can be done in Phase 8 or Phase 9.
  # ===========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: stagepass-zookeeper
    restart: unless-stopped
    profiles: [infra]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_AUTH_PROVIDER_SASL: org.apache.zookeeper.server.auth.SASLAuthenticationProvider
      KAFKA_OPTS: >-
        -Djava.security.auth.login.config=/etc/kafka/zookeeper_jaas.conf
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
      - ./config/kafka/kafka_jaas.conf:/etc/kafka/zookeeper_jaas.conf:ro
    networks:
      - stagepass-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q 'Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # bitnami images run as non-root by default (uid 1001) ✓

  # ===========================================================================
  # KAFKA — SASL/SCRAM-SHA-512 enforced (THR-PLAT-01 Phase 2 gate blocker)
  # Memory: 384 MB
  #
  # SECURITY: SASL_PLAINTEXT for local dev (plaintext inside Docker bridge
  # network is acceptable — no external exposure). Phase 9 / Istio upgrades
  # to mTLS (SASL_SSL or Istio service mesh encryption).
  #
  # LISTENERS:
  #   INTERNAL — service-to-broker within Docker network (SASL_PLAINTEXT)
  #   EXTERNAL — host machine access for tooling (SASL_PLAINTEXT, port 29092)
  # ===========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: stagepass-kafka
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    networks:
      - stagepass-net
    mem_limit: 384m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  10
      start_period: 60s
  # ===========================================================================
  # KAFKA INIT — provisions SCRAM users and topic ACLs after broker is healthy
  # This container runs to completion and exits 0. It is not a persistent service.
  # ===========================================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: stagepass-kafka-init
    profiles: [infra]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_ADMIN_PASSWORD:           ${KAFKA_ADMIN_PASSWORD}
      KAFKA_BOOKING_PASSWORD:         ${KAFKA_BOOKING_PASSWORD}
      KAFKA_PAYMENT_PASSWORD:         ${KAFKA_PAYMENT_PASSWORD}
      KAFKA_SEAT_PASSWORD:            ${KAFKA_SEAT_PASSWORD}
      KAFKA_TICKET_PASSWORD:          ${KAFKA_TICKET_PASSWORD}
      KAFKA_NOTIFICATION_PASSWORD:    ${KAFKA_NOTIFICATION_PASSWORD}
      KAFKA_FRAUD_PASSWORD:           ${KAFKA_FRAUD_PASSWORD}
      KAFKA_WAITLIST_PASSWORD:        ${KAFKA_WAITLIST_PASSWORD}
      KAFKA_EVENT_PASSWORD:           ${KAFKA_EVENT_PASSWORD}
      KAFKA_VENUE_PASSWORD:           ${KAFKA_VENUE_PASSWORD}
      KAFKA_DISBURSEMENT_PASSWORD:    ${KAFKA_DISBURSEMENT_PASSWORD}
      KAFKA_ANALYTICS_PASSWORD:       ${KAFKA_ANALYTICS_PASSWORD}
      KAFKA_SEARCH_PASSWORD:          ${KAFKA_SEARCH_PASSWORD}
      KAFKA_RECOMMENDATION_PASSWORD:  ${KAFKA_RECOMMENDATION_PASSWORD}
    volumes:
      - ./init/kafka/kafka-init.sh:/kafka-init.sh:ro
    command: ["bash", "/kafka-init.sh"]
    networks:
      - stagepass-net
    restart: "no"   # One-shot init — do not restart on exit
    mem_limit: 256m

  # ===========================================================================
  # ELASTICSEARCH — single-node, discovery.type=single-node
  # Primary store: Search Service (event index)
  # Memory: 512 MB (heap: 256m per ES recommendation for heap = ~50% of container)
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: stagepass-elasticsearch
    restart: unless-stopped
    profiles: [infra]
    environment:
      discovery.type:             single-node
      ES_JAVA_OPTS:               "-Xms256m -Xmx256m"
      xpack.security.enabled:     "true"
      xpack.security.http.ssl.enabled: "false"   # HTTP SSL off — TLS at Istio layer in Phase 9
      ELASTIC_PASSWORD:           ${ELASTICSEARCH_PASSWORD}
      # Required for single-node to allow yellow cluster status (no replicas)
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - stagepass-net
    mem_limit: 512m
    mem_reservation: 384m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 20s
      timeout:  10s
      retries:  15
      start_period: 120s
    # Elasticsearch 8.x runs as elasticsearch user (uid 1000) — non-root ✓

  # ===========================================================================
  # CLICKHOUSE — OLAP store for analytics time-series
  # Memory: 256 MB
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.4-alpine
    container_name: stagepass-clickhouse
    restart: unless-stopped
    profiles: [infra]
    environment:
      CLICKHOUSE_USER:     analytics_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB:       analytics_db
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP interface
    networks:
      - stagepass-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query='SELECT 1' 2>/dev/null || exit 1"]
      interval: 10s
      timeout:  10s
      retries:  10
      start_period: 60s
    # ClickHouse alpine runs as clickhouse user (uid 101) — non-root ✓

  # ===========================================================================
  # QDRANT — vector database for Recommendation and Chatbot RAG
  # Two collections will be created at service bring-up (not at infra level):
  #   - event_embeddings   (Recommendation Service)
  #   - chatbot_corpus     (Chatbot RAG)
  # Memory: 256 MB
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: stagepass-qdrant
    restart: unless-stopped
    profiles: [infra]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    networks:
      - stagepass-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s
    # Qdrant runs as qdrant user — non-root ✓

  # ===========================================================================
  # MINIO — S3-compatible object storage
  # Stores: event posters, venue photos, PDF ticket files
  # Memory: 128 MB
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: stagepass-minio
    restart: unless-stopped
    profiles: [infra]
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Prometheus metrics endpoint (scraped by Prometheus)
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9010:9000"   # S3 API (9010 on host — 9000 is taken by ClickHouse)
      - "9011:9001"   # MinIO Console UI
    networks:
      - stagepass-net
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test:     ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s
    # MinIO runs as non-root user ✓

  # ===========================================================================
  # VAULT — HashiCorp Vault in dev mode
  #
  # WHY DEV MODE IN PHASE 2:
  #   Vault dev mode starts unsealed, stores everything in memory, and provides
  #   a root token. This is acceptable for Phase 2–3 local development where
  #   the goal is to establish the pattern of reading secrets from Vault, not
  #   to operate Vault securely. Phase 9 transitions to production mode with
  #   auto-unseal via AWS KMS.
  #
  # ⚠️  NEVER USE DEV MODE IN STAGING OR PRODUCTION.
  #
  # Placeholder secrets are seeded by vault-init after startup.
  # All service environment variables that would normally come from Vault
  # are documented in .env.local.example.
  # ===========================================================================
  vault:
    image: hashicorp/vault:1.16
    container_name: stagepass-vault
    restart: unless-stopped
    profiles: [infra]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID:     ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS:    "0.0.0.0:8200"
      VAULT_LOG_LEVEL:             info
    cap_add:
      - IPC_LOCK   # Required by Vault to prevent secret swapping to disk
    volumes:
      - vault-data:/vault/data
    ports:
      - "8200:8200"
    networks:
      - stagepass-net
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test:     ["CMD-SHELL", "vault status -address=http://localhost:8200 | grep -q 'Sealed.*false'"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s
    # Vault container runs as vault user (uid 100) — non-root ✓

  # ===========================================================================
  # ─── OBSERVABILITY STACK ────────────────────────────────────────────────────
  # All observability services are included in --profile infra because the
  # Phase 2 DoD requires Prometheus scrape targets and Grafana dashboards.
  # ===========================================================================

  # ===========================================================================
  # PROMETHEUS — metrics collection and alerting
  # Memory: 256 MB
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: stagepass-prometheus
    restart: unless-stopped
    profiles: [infra]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"          # Allow config reload via HTTP POST
      - "--web.enable-admin-api"
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 10s
      timeout:  5s
      retries:  5
    # prom/prometheus runs as nobody (uid 65534) — non-root ✓

  # ===========================================================================
  # GRAFANA — dashboards and alerting UI
  # Memory: 256 MB
  # Provisioned with: Prometheus + Loki + Jaeger datasources,
  #                   StagePass Overview dashboard skeleton
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.4.3
    container_name: stagepass-grafana
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      - prometheus
      - loki
      - jaeger
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_LOG_LEVEL:               warn
      # Feature toggles for Loki ↔ Jaeger correlation (NFR-OBS-004)
      GF_FEATURE_TOGGLES_ENABLE: "traceToMetrics,correlations"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 30s
    # grafana/grafana runs as grafana user (uid 472) — non-root ✓

  # ===========================================================================
  # LOKI — log aggregation
  # Memory: 256 MB
  # ===========================================================================
  loki:
    image: grafana/loki:3.0.0
    container_name: stagepass-loki
    restart: unless-stopped
    profiles: [infra]
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ../../observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 30s
    # Loki runs as loki user — non-root ✓

  # ===========================================================================
  # PROMTAIL — log collector agent (runs on the same Docker host)
  # Collects container logs from /var/log/docker and pushes to Loki.
  # Memory: 64 MB
  # ===========================================================================
  promtail:
    image: grafana/promtail:3.0.0
    container_name: stagepass-promtail
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      # Read Docker container logs from the host
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /run/docker.sock:/run/docker.sock:ro
      - ./config/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 64m
    mem_reservation: 32m
    # Promtail needs to read Docker socket — runs as root or docker group
    user: "0:0"

  # ===========================================================================
  # JAEGER ALL-IN-ONE — distributed trace collection and query
  # Memory: 256 MB
  # Receives traces from OTel Collector via OTLP gRPC (4317)
  # UI accessible at http://localhost:16686
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: stagepass-jaeger
    restart: unless-stopped
    profiles: [infra]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE:      memory   # In-memory for local dev; Phase 9 → Elasticsearch backend
      MEMORY_MAX_TRACES:      50000
    ports:
      - "16686:16686"   # Jaeger UI
      - "14268:14268"   # Jaeger HTTP collector (legacy — kept for compatibility)
      - "4317:4317"     # OTLP gRPC receiver (used by OTel Collector)
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://localhost:14269/ready | grep -q -"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s
    # Jaeger all-in-one runs as non-root ✓

  # ===========================================================================
  # OPENTELEMETRY COLLECTOR — single telemetry ingestion point
  # Receives OTLP from all services; routes to Jaeger (traces) and
  # Prometheus (metrics). NFR-OBS-003.
  # Memory: 128 MB
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: stagepass-otel-collector
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      - jaeger
      - prometheus
    command: ["--config=/etc/otel/otel-collector-config.yaml"]
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    ports:
      - "4320:4317"     # OTLP gRPC — services use port 4320 on host (Jaeger uses 4317 internally)
                        # on 4318 (HTTP) or use the collector's port on a different host mapping.
                        # Adjusted: collector OTLP gRPC on 4320 externally to avoid conflict.
      - "4318:4318"     # OTLP HTTP — services send traces here
      - "8888:8888"     # OTel Collector self-metrics
      - "8889:8889"     # Prometheus exporter endpoint
      - "13133:13133"   # Health check
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ===========================================================================
  # ─── PROMETHEUS EXPORTERS ────────────────────────────────────────────────────
  # Sidecar exporters expose /metrics for infrastructure components that
  # do not natively speak Prometheus. One per database type for isolation.
  # ===========================================================================

  # postgres_exporter — one per service database for granular metrics
  # Shared image, different DATA_SOURCE_NAME per instance
  postgres-exporter-auth:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: stagepass-pg-exporter-auth
    restart: unless-stopped
    profiles: [infra]
    depends_on: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://auth_user:${POSTGRES_AUTH_PASSWORD}@postgres:5432/auth_db?sslmode=disable"
    networks:
      - stagepass-net
    mem_limit: 32m

  postgres-exporter-seat:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: stagepass-pg-exporter-seat
    restart: unless-stopped
    profiles: [infra]
    depends_on: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://seat_user:${POSTGRES_SEAT_PASSWORD}@postgres:5432/seat_inventory_db?sslmode=disable"
    networks:
      - stagepass-net
    mem_limit: 32m

  postgres-exporter-booking:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: stagepass-pg-exporter-booking
    restart: unless-stopped
    profiles: [infra]
    depends_on: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://booking_user:${POSTGRES_BOOKING_PASSWORD}@postgres:5432/booking_write_db?sslmode=disable"
    networks:
      - stagepass-net
    mem_limit: 32m

  postgres-exporter-payment:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: stagepass-pg-exporter-payment
    restart: unless-stopped
    profiles: [infra]
    depends_on: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://payment_user:${POSTGRES_PAYMENT_PASSWORD}@postgres:5432/payment_db?sslmode=disable"
    networks:
      - stagepass-net
    mem_limit: 32m

  postgres-exporter-disbursement:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: stagepass-pg-exporter-disbursement
    restart: unless-stopped
    profiles: [infra]
    depends_on: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://disbursement_user:${POSTGRES_DISBURSEMENT_PASSWORD}@postgres:5432/disbursement_db?sslmode=disable"
    networks:
      - stagepass-net
    mem_limit: 32m

  # MongoDB exporter
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: stagepass-mongodb-exporter
    restart: unless-stopped
    profiles: [infra]
    depends_on: [mongodb]
    environment:
      MONGODB_URI: "mongodb://mongoadmin:${MONGO_ROOT_PASSWORD}@mongodb:27017/admin"
    networks:
      - stagepass-net
    mem_limit: 32m

  # Redis exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.60.0
    container_name: stagepass-redis-exporter
    restart: unless-stopped
    profiles: [infra]
    depends_on: [redis]
    environment:
      REDIS_ADDR:     "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    networks:
      - stagepass-net
    mem_limit: 32m

  # Kafka exporter — critical for consumer group lag (NFR-REL-007 DLQ alert)
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: stagepass-kafka-exporter
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=kafka:9092"
    networks:
      - stagepass-net
    mem_limit: 32m

  # Elasticsearch exporter
  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.7.0
    container_name: stagepass-es-exporter
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ES_URI: "http://elastic:${ELASTICSEARCH_PASSWORD}@elasticsearch:9200"
    networks:
      - stagepass-net
    mem_limit: 32m

  # ===========================================================================
  # ─── SONARQUBE (--profile ci) ────────────────────────────────────────────────
  # NOT in --profile infra — see file header for rationale.
  # Start on-demand: docker compose --profile ci up -d sonarqube
  # Memory: ~1.2 GB (outside the infra profile budget envelope)
  # ===========================================================================
  sonarqube-postgres:
    image: postgres:16-alpine
    container_name: stagepass-sonarqube-postgres
    restart: unless-stopped
    profiles: [ci]
    environment:
      POSTGRES_USER:     sonar
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD}
      POSTGRES_DB:       sonarqube
    volumes:
      - sonarqube-postgres-data:/var/lib/postgresql/data
    networks:
      - stagepass-net
    mem_limit: 256m
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout:  5s
      retries:  5

  sonarqube:
    image: sonarqube:10.5-community
    container_name: stagepass-sonarqube
    restart: unless-stopped
    profiles: [ci]
    depends_on:
      sonarqube-postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL:      "jdbc:postgresql://sonarqube-postgres:5432/sonarqube"
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD}
      SONAR_WEB_JAVAADDITIONALOPTS: "-Xmx512m -Xms128m"
      SONAR_CE_JAVAADDITIONALOPTS:  "-Xmx256m -Xms64m"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    ports:
      - "9080:9000"   # SonarQube UI (9080 on host — 9000 taken by ClickHouse native)
    networks:
      - stagepass-net
    mem_limit: 1024m
    mem_reservation: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q UP"]
      interval: 30s
      timeout:  10s
      retries:  10
      start_period: 120s

  # ===========================================================================
  # AUTH SERVICE — Phase 3
  # Spring Boot 3 + Java 21 — T1 service (99.9% SLO)
  # Database: auth_db on shared postgres (auth_user — CONNECT to auth_db only)
  # Cache:    Redis DB 0 (JTI blocklist + rate-limit counters)
  # Memory:   512 MB (NFR §5.4 T1 allocation)
  # ===========================================================================
  auth-service:
    build:
      context: ../../../stagepass-auth-service
      dockerfile: Dockerfile
    image: stagepass-auth-service:local
    container_name: auth-service
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      SPRING_DATA_REDIS_HOST:     redis
      SPRING_DATA_REDIS_PORT:     6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 0
      AUTH_RSA_PRIVATE_KEY: ${AUTH_RSA_PRIVATE_KEY}
      AUTH_RSA_PUBLIC_KEY:  ${AUTH_RSA_PUBLIC_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks:
      - stagepass-net
    mem_limit: 512m
    mem_reservation: 256m

  # ===========================================================================
  # EVENT SERVICE — Phase 3
  # NestJS 10 + TypeScript — T2 service (99.5% SLO)
  # Database: event_db on shared mongodb (event_user — readWrite on event_db only)
  # Kafka:    producer on event.events topic (kafka:9092 internal listener)
  # JWKS:     fetched from auth-service at startup — depends_on auth-service healthy
  # Memory:   256 MB (NFR §5.4 T2 Node.js allocation)
  # ===========================================================================
  event-service:
    build:
      context: ../../../stagepass-event-service
      dockerfile: Dockerfile
    image: stagepass-event-service:local
    container_name: event-service
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      PORT:            8082
      NODE_ENV:        docker
      MONGODB_URI:     mongodb://event_user:${MONGO_EVENT_PASSWORD}@mongodb:27017/event_db
      MONGODB_DB_NAME: event_db
      KAFKA_BROKERS:   kafka:9092
      KAFKA_CLIENT_ID: event-service
      KAFKA_GROUP_ID:  event-service-group
      # auth-service is reachable by container name within stagepass-net
      JWKS_URI:        http://auth-service:8081/auth/jwks
    networks:
      - stagepass-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health/live | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s