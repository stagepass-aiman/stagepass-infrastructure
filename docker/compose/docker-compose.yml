# =============================================================================
# docker-compose.yml — StagePass Local Infrastructure Stack
#
# Repo:    stagepass-infrastructure
# Path:    /docker/compose/docker-compose.yml
# Version: 0.4.0
# Status:  Phase 4 — Seat Inventory Service Integration
#
# CHANGELOG:
#   0.4.0 — Add seat-inventory-service (Phase 4, T1 Critical).
#            gRPC-only service: no REST surface, no API Gateway route.
#            gRPC port 9090 → host 19090 (host 9090 taken by Prometheus).
#            Actuator port 8090 → host 8084 (sequential: auth=8081/event=8082/venue=8083).
#            No Docker HEALTHCHECK — distroless base image has no shell (RULE-15).
#            KAFKA_BROKERS: kafka:9092 — internal listener (RULE-16).
#            OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318 (RULE-16).
#            Redis key namespacing prevents collision with Auth Service (db 0):
#              Auth:           jti:{id}, rate:{ip}
#              Seat Inventory: seat:{eventId}:{seatId}, flash-hold-processed:{id}
#            PHASE 7 TODO: evaluate allkeys-lru eviction risk for seat hold keys.
#   0.3.0 — Replace mongo-rs-init sidecar with embedded startup script.
#            Sidecar container with condition: service_healthy hangs
#            permanently on Windows Docker Desktop (RULE-31). Fix: mount
#            mongo-entrypoint.sh into the MongoDB container — it generates
#            the keyFile, polls until mongod is ready, then calls rs.initiate().
#            Remove mongo-rs-init service and its dependency from all services.
#   0.2.0 — Add Venue Service. Upgrade MongoDB to single-node replica set.
#   0.1.0 — Phase 2 baseline.
# =============================================================================

name: stagepass

networks:
  stagepass-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  observability-net:
    driver: bridge

volumes:
  postgres-data:
    name: stagepass_postgres_data
  mongodb-data:
    name: stagepass_mongodb_data
  redis-data:
    name: stagepass_redis_data
  kafka-data:
    name: stagepass_kafka_data
  zookeeper-data:
    name: stagepass_zookeeper_data
  zookeeper-log:
    name: stagepass_zookeeper_log
  elasticsearch-data:
    name: stagepass_elasticsearch_data
  clickhouse-data:
    name: stagepass_clickhouse_data
  qdrant-data:
    name: stagepass_qdrant_data
  minio-data:
    name: stagepass_minio_data
  vault-data:
    name: stagepass_vault_data
  prometheus-data:
    name: stagepass_prometheus_data
  grafana-data:
    name: stagepass_grafana_data
  loki-data:
    name: stagepass_loki_data
  sonarqube-data:
    name: stagepass_sonarqube_data
  sonarqube-logs:
    name: stagepass_sonarqube_logs
  sonarqube-extensions:
    name: stagepass_sonarqube_extensions
  sonarqube-postgres-data:
    name: stagepass_sonarqube_postgres_data

services:
  # ===========================================================================
  # POSTGRESQL
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: stagepass-postgres
    restart: unless-stopped
    profiles: [infra]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      POSTGRES_SEAT_PASSWORD: ${POSTGRES_SEAT_PASSWORD}
      POSTGRES_BOOKING_PASSWORD: ${POSTGRES_BOOKING_PASSWORD}
      POSTGRES_PAYMENT_PASSWORD: ${POSTGRES_PAYMENT_PASSWORD}
      POSTGRES_DISBURSEMENT_PASSWORD: ${POSTGRES_DISBURSEMENT_PASSWORD}
      POSTGRES_TICKET_PASSWORD: ${POSTGRES_TICKET_PASSWORD}
      POSTGRES_CHECKIN_PASSWORD: ${POSTGRES_CHECKIN_PASSWORD}
      POSTGRES_FRAUD_PASSWORD: ${POSTGRES_FRAUD_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres/01-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    ports:
      - "5432:5432"
    networks:
      - stagepass-net
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # MONGODB — single-node replica set (rs0)
  #
  # PHASE 4: runs as replica set for Venue Service Outbox transactions.
  #
  # Startup is handled by the mounted mongo-entrypoint.sh which:
  #   1. Generates a keyFile inside the container (required when auth +
  #      replica set are both active — Windows-mounted files fail chmod 400).
  #   2. Spawns a background poll loop that waits for mongod to accept
  #      authenticated connections, then calls rs.initiate().
  #   3. exec's the original docker-entrypoint.sh to preserve MONGO_INITDB_*
  #      user creation and /docker-entrypoint-initdb.d/ script execution.
  #
  # WHY NOT A SIDECAR CONTAINER (RULE-31):
  #   condition: service_healthy dependency propagation hangs permanently on
  #   Windows Docker Desktop. Embedded script is the only reliable fix.
  # ===========================================================================
  mongodb:
    image: mongo:7.0
    container_name: stagepass-mongodb
    restart: unless-stopped
    profiles: [infra]
    entrypoint: ["bash", "/init/mongo-entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_EVENT_PASSWORD: ${MONGO_EVENT_PASSWORD}
      MONGO_VENUE_PASSWORD: ${MONGO_VENUE_PASSWORD}
      MONGO_BOOKING_READ_PASSWORD: ${MONGO_BOOKING_READ_PASSWORD}
    volumes:
      - mongodb-data:/data/db
      - ./init/mongo/mongo-entrypoint.sh:/init/mongo-entrypoint.sh:ro
      - ./init/mongo/01-init-databases.js:/docker-entrypoint-initdb.d/01-init-databases.js:ro
    ports:
      - "27017:27017"
    networks:
      - stagepass-net
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # REDIS
  # ===========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: stagepass-redis
    restart: unless-stopped
    profiles: [infra]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 220mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - stagepass-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    user: "999:999"
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # ZOOKEEPER
  # ===========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: stagepass-zookeeper
    restart: unless-stopped
    profiles: [infra]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_AUTH_PROVIDER_SASL: org.apache.zookeeper.server.auth.SASLAuthenticationProvider
      KAFKA_OPTS: >-
        -Djava.security.auth.login.config=/etc/kafka/zookeeper_jaas.conf
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
      - ./config/kafka/kafka_jaas.conf:/etc/kafka/zookeeper_jaas.conf:ro
    networks:
      - stagepass-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo srvr | nc localhost 2181 | grep -q 'Zookeeper version'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================================================
  # KAFKA
  # ===========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: stagepass-kafka
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    networks:
      - stagepass-net
    mem_limit: 384m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ===========================================================================
  # KAFKA INIT
  # ===========================================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: stagepass-kafka-init
    profiles: [infra]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD}
      KAFKA_BOOKING_PASSWORD: ${KAFKA_BOOKING_PASSWORD}
      KAFKA_PAYMENT_PASSWORD: ${KAFKA_PAYMENT_PASSWORD}
      KAFKA_SEAT_PASSWORD: ${KAFKA_SEAT_PASSWORD}
      KAFKA_TICKET_PASSWORD: ${KAFKA_TICKET_PASSWORD}
      KAFKA_NOTIFICATION_PASSWORD: ${KAFKA_NOTIFICATION_PASSWORD}
      KAFKA_FRAUD_PASSWORD: ${KAFKA_FRAUD_PASSWORD}
      KAFKA_WAITLIST_PASSWORD: ${KAFKA_WAITLIST_PASSWORD}
      KAFKA_EVENT_PASSWORD: ${KAFKA_EVENT_PASSWORD}
      KAFKA_VENUE_PASSWORD: ${KAFKA_VENUE_PASSWORD}
      KAFKA_DISBURSEMENT_PASSWORD: ${KAFKA_DISBURSEMENT_PASSWORD}
      KAFKA_ANALYTICS_PASSWORD: ${KAFKA_ANALYTICS_PASSWORD}
      KAFKA_SEARCH_PASSWORD: ${KAFKA_SEARCH_PASSWORD}
      KAFKA_RECOMMENDATION_PASSWORD: ${KAFKA_RECOMMENDATION_PASSWORD}
    volumes:
      - ./init/kafka/kafka-init.sh:/kafka-init.sh:ro
    command: ["bash", "/kafka-init.sh"]
    networks:
      - stagepass-net
    restart: "no"
    mem_limit: 256m

  # ===========================================================================
  # ELASTICSEARCH
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: stagepass-elasticsearch
    restart: unless-stopped
    profiles: [infra]
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - stagepass-net
    mem_limit: 512m
    mem_reservation: 384m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -u elastic:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health | grep -qE 'green|yellow'",
        ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

  # ===========================================================================
  # CLICKHOUSE
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.4-alpine
    container_name: stagepass-clickhouse
    restart: unless-stopped
    profiles: [infra]
    environment:
      CLICKHOUSE_USER: analytics_user
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: analytics_db
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    networks:
      - stagepass-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --query='SELECT 1' 2>/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ===========================================================================
  # QDRANT
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: stagepass-qdrant
    restart: unless-stopped
    profiles: [infra]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - stagepass-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================================================
  # MINIO
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: stagepass-minio
    restart: unless-stopped
    profiles: [infra]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9010:9000"
      - "9011:9001"
    networks:
      - stagepass-net
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================================================
  # VAULT
  # ===========================================================================
  vault:
    image: hashicorp/vault:1.16
    container_name: stagepass-vault
    restart: unless-stopped
    profiles: [infra]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_LOG_LEVEL: info
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
    ports:
      - "8200:8200"
    networks:
      - stagepass-net
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "vault status -address=http://localhost:8200 | grep -q 'Sealed.*false'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================================================
  # OBSERVABILITY STACK
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: stagepass-prometheus
    restart: unless-stopped
    profiles: [infra]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9090/-/healthy | grep -q Healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.3
    container_name: stagepass-grafana
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      - prometheus
      - loki
      - jaeger
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: warn
      GF_FEATURE_TOGGLES_ENABLE: "traceToMetrics,correlations"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  loki:
    image: grafana/loki:3.0.0
    container_name: stagepass-loki
    restart: unless-stopped
    profiles: [infra]
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ../../observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  promtail:
    image: grafana/promtail:3.0.0
    container_name: stagepass-promtail
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /run/docker.sock:/run/docker.sock:ro
      - ./config/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 64m
    mem_reservation: 32m
    user: "0:0"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: stagepass-jaeger
    restart: unless-stopped
    profiles: [infra]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: 50000
    ports:
      - "16686:16686"
      - "14268:14268"
      - "4317:4317"
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ready | grep -q -"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: stagepass-otel-collector
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      - jaeger
      - prometheus
    command: ["--config=/etc/otel/otel-collector-config.yaml"]
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    ports:
      - "4320:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
      - "13133:13133"
    networks:
      - stagepass-net
      - observability-net
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # PROMETHEUS EXPORTERS
  # ===========================================================================
  postgres-exporter-auth:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: stagepass-pg-exporter-auth
    restart: unless-stopped
    profiles: [infra]
    depends_on: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://auth_user:${POSTGRES_AUTH_PASSWORD}@postgres:5432/auth_db?sslmode=disable"
    networks:
      - stagepass-net
    mem_limit: 32m

  postgres-exporter-seat:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: stagepass-pg-exporter-seat
    restart: unless-stopped
    profiles: [infra]
    depends_on: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://seat_user:${POSTGRES_SEAT_PASSWORD}@postgres:5432/seat_inventory_db?sslmode=disable"
    networks:
      - stagepass-net
    mem_limit: 32m

  postgres-exporter-booking:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: stagepass-pg-exporter-booking
    restart: unless-stopped
    profiles: [infra]
    depends_on: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://booking_user:${POSTGRES_BOOKING_PASSWORD}@postgres:5432/booking_write_db?sslmode=disable"
    networks:
      - stagepass-net
    mem_limit: 32m

  postgres-exporter-payment:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: stagepass-pg-exporter-payment
    restart: unless-stopped
    profiles: [infra]
    depends_on: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://payment_user:${POSTGRES_PAYMENT_PASSWORD}@postgres:5432/payment_db?sslmode=disable"
    networks:
      - stagepass-net
    mem_limit: 32m

  postgres-exporter-disbursement:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: stagepass-pg-exporter-disbursement
    restart: unless-stopped
    profiles: [infra]
    depends_on: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://disbursement_user:${POSTGRES_DISBURSEMENT_PASSWORD}@postgres:5432/disbursement_db?sslmode=disable"
    networks:
      - stagepass-net
    mem_limit: 32m

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: stagepass-mongodb-exporter
    restart: unless-stopped
    profiles: [infra]
    depends_on: [mongodb]
    environment:
      MONGODB_URI: "mongodb://mongoadmin:${MONGO_ROOT_PASSWORD}@mongodb:27017/admin"
    networks:
      - stagepass-net
    mem_limit: 32m

  redis-exporter:
    image: oliver006/redis_exporter:v1.60.0
    container_name: stagepass-redis-exporter
    restart: unless-stopped
    profiles: [infra]
    depends_on: [redis]
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    networks:
      - stagepass-net
    mem_limit: 32m

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: stagepass-kafka-exporter
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=kafka:9092"
    networks:
      - stagepass-net
    mem_limit: 32m

  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.7.0
    container_name: stagepass-es-exporter
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ES_URI: "http://elastic:${ELASTICSEARCH_PASSWORD}@elasticsearch:9200"
    networks:
      - stagepass-net
    mem_limit: 32m

  # ===========================================================================
  # SONARQUBE (--profile ci)
  # ===========================================================================
  sonarqube-postgres:
    image: postgres:16-alpine
    container_name: stagepass-sonarqube-postgres
    restart: unless-stopped
    profiles: [ci]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD}
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube-postgres-data:/var/lib/postgresql/data
    networks:
      - stagepass-net
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:10.5-community
    container_name: stagepass-sonarqube
    restart: unless-stopped
    profiles: [ci]
    depends_on:
      sonarqube-postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: "jdbc:postgresql://sonarqube-postgres:5432/sonarqube"
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD}
      SONAR_WEB_JAVAADDITIONALOPTS: "-Xmx512m -Xms128m"
      SONAR_CE_JAVAADDITIONALOPTS: "-Xmx256m -Xms64m"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    ports:
      - "9080:9000"
    networks:
      - stagepass-net
    mem_limit: 1024m
    mem_reservation: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9000/api/system/status | grep -q UP",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ===========================================================================
  # AUTH SERVICE — Phase 3
  # ===========================================================================
  auth-service:
    build:
      context: ../../../stagepass-auth-service
      dockerfile: Dockerfile
    image: stagepass-auth-service:local
    container_name: auth-service
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: 0
      AUTH_RSA_PRIVATE_KEY: ${AUTH_RSA_PRIVATE_KEY}
      AUTH_RSA_PUBLIC_KEY: ${AUTH_RSA_PUBLIC_KEY}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    networks:
      - stagepass-net
    mem_limit: 512m
    mem_reservation: 256m

  # ===========================================================================
  # EVENT SERVICE — Phase 3
  # PHASE 4 CHANGE: directConnection=true added to MONGODB_URI.
  # mongo-rs-init dependency removed — rs0 initialised by mongo-entrypoint.sh.
  # ===========================================================================
  event-service:
    build:
      context: ../../../stagepass-event-service
      dockerfile: Dockerfile
    image: stagepass-event-service:local
    container_name: event-service
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      NODE_ENV: production
      MONGODB_URI: mongodb://event_user:${MONGO_EVENT_PASSWORD}@mongodb:27017/event_db?directConnection=true
      MONGODB_DB_NAME: event_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: event-service
      KAFKA_GROUP_ID: event-service-group
      JWKS_URI: http://auth-service:8081/auth/jwks
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: event-service
    networks:
      - stagepass-net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/health/live | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ===========================================================================
  # VENUE SERVICE — Phase 4
  # mongo-rs-init dependency removed — rs0 initialised by mongo-entrypoint.sh.
  # ===========================================================================
  venue-service:
    build:
      context: ../../../stagepass-venue-service
      dockerfile: Dockerfile
    image: stagepass-venue-service:local
    container_name: venue-service
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9092
      MONGODB_URI: mongodb://venue_user:${MONGO_VENUE_PASSWORD}@mongodb:27017/venue_db?directConnection=true
      AUTH_JWKS_URI: http://auth-service:8081/auth/jwks
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: venue-service
    networks:
      - stagepass-net
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8083/health/ready | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ===========================================================================
  # SEAT INVENTORY SERVICE — Phase 4
  #
  # T1 Critical — correctness gate for all seat holds and bookings.
  #
  # gRPC-only service (ADR-003 §3.3.1): no REST surface, no API Gateway route.
  # Two-store architecture (ADR-006 §3.1):
  #   Redis Lua SETNX — atomic seat hold mutual exclusion (NFR-PERF-001: p99 < 500ms)
  #   PostgreSQL SERIALIZABLE — durable commit, CommitSeats only (NFR-REL-008)
  #
  # Interfaces:
  #   gRPC  container:9090 → host:19090  (Booking Service only; K8s NetworkPolicy)
  #   HTTP  container:8090 → host:8084   (Spring Actuator: health + /metrics only)
  #
  # Port decisions:
  #   host 9090 is taken by Prometheus → gRPC mapped to host 19090.
  #   host 8084 continues the sequential Actuator port series:
  #     auth=8081, event=8082, venue=8083, seat-inventory=8084.
  #
  # No Docker HEALTHCHECK — distroless base image has no shell (RULE-15).
  # Verify liveness from host: curl http://localhost:8084/actuator/health/liveness
  #
  # Redis: shared stagepass-redis (database 0, default).
  # Key namespacing prevents collision with Auth Service:
  #   Auth:           jti:{id}, rate:{ip}
  #   Seat Inventory: seat:{eventId}:{seatId}, flash-hold-processed:{id}
  # PHASE 7 TODO: evaluate allkeys-lru eviction risk for seat hold keys.
  #   If Redis memory pressure causes seat hold key eviction before TTL,
  #   the hold is silently released. Mitigations: (a) reserved-memory-percent,
  #   (b) volatile-lru + explicit EXPIRE on all keys,
  #   (c) dedicated Redis instance for Seat Inventory.
  # ===========================================================================
  seat-inventory-service:
    build:
      context: ../../../stagepass-seat-inventory-service
      dockerfile: Dockerfile
    image: stagepass-seat-inventory-service:local
    container_name: seat-inventory-service
    restart: unless-stopped
    profiles: [infra]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "19090:9090" # gRPC — Booking Service consumer (host 9090 taken by Prometheus)
      - "8084:8090" # Spring Actuator — health probes + Prometheus scrape
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # PostgreSQL — seat_inventory_db created by init/postgres/01-init-databases.sh
      SEAT_INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/seat_inventory_db
      SEAT_INVENTORY_DB_USER: seat_user
      SEAT_INVENTORY_DB_PASSWORD: ${POSTGRES_SEAT_PASSWORD}
      # Redis — shared stagepass-redis; key-namespaced to avoid collision with Auth
      SEAT_INVENTORY_REDIS_HOST: redis
      SEAT_INVENTORY_REDIS_PORT: 6379
      SEAT_INVENTORY_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Kafka — internal listener only (RULE-16: never localhost:9092 inside Docker)
      KAFKA_BROKERS: kafka:9092
      # Ports — override defaults declared in application.yml
      MANAGEMENT_PORT: 8090 # Spring server.port (Actuator HTTP)
      GRPC_PORT: 9090 # grpc.server.port (gRPC Netty)
      # Observability — RULE-16: collector reachable by container name, not localhost
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: seat-inventory-service
    networks:
      - stagepass-net
    mem_limit: 512m
    mem_reservation: 256m
    # No healthcheck — distroless image has no shell (RULE-15).
    # Kubernetes liveness/readiness probes target Actuator HTTP from outside.
    # Local verification: curl -s http://localhost:8084/actuator/health/readiness
