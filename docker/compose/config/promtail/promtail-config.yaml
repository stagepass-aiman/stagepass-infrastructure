server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collect all Docker container logs for the StagePass compose project.
  # Stream labels (indexed): service, container, compose_project, level.
  # Correlation IDs (trace_id, span_id, bookingId, eventId, userId) are NOT
  # labels — they are parsed at QUERY time from the JSON body via `| json`.
  #
  # WHY trace_id is deliberately NOT a label (this is the load-bearing decision):
  # Loki's inverted index is built only on stream labels. Trace ids are
  # unbounded — one per request — so promoting trace_id to a label creates one
  # Loki stream per request, blowing up the index and slowing every query.
  # Trace->log correlation does not need it as a label: Grafana derived fields
  # extract trace_id from the line at query time and build the Jaeger link, and
  # NFR-OBS-004 is met by `{service="x"} | json | trace_id="..."` — the
  # `{service=...}` label plus the time window narrow to a few chunks first
  # (index-time), then the body filter is a cheap brute-force scan (query-time).
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=stagepass"]
    relabel_configs:
      # Use the Docker Compose service name as the Loki 'service' label.
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Use the container name as an additional label for debugging.
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      # Add the project (compose name) as a label.
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project

    pipeline_stages:
      # Parse the JSON line and extract ONLY 'level' — the single low-cardinality
      # field we promote to a stream label. StagePass services emit structured
      # JSON (NFR-OBS-001); infra components (Postgres, Redis, ...) emit plain
      # text and simply won't match, leaving their raw line in 'message'.
      #
      # NOTE: we do NOT extract trace_id/bookingId/etc. here. An extracted value
      # that is never promoted to a label and never consumed by a later stage is
      # a no-op — it does nothing but mislead the next reader. Those fields are
      # available at query time through `| json`.
      - json:
          expressions:
            level: level
      # Promote ONLY 'level' to a label. Low, bounded cardinality
      # (TRACE/DEBUG/INFO/WARN/ERROR) — safe and useful for filtering.
      - labels:
          level: ""
