// Kafka broker JAAS configuration — SASL/SCRAM-SHA-512
// Used by both the Kafka broker and ZooKeeper authentication.
//
// WHY THIS EXISTS:
//   THR-PLAT-01 (STRIDE §8) requires that every Kafka producer/consumer
//   authenticates with a per-service credential. This file configures the
//   broker's own authentication context.
//
//   KafkaServer  — broker's own login (used for inter-broker auth)
//   KafkaClient  — used by admin tooling connecting to the broker
//   Client       — ZooKeeper client auth (Kafka connecting to ZK)
//   Server       — ZooKeeper server auth (ZK authenticating Kafka)
//
// NOTE: The admin password here is a placeholder.
// The kafka-init container provisions per-service SCRAM credentials
// after the broker starts. Services never use the admin credential.

KafkaServer {
   org.apache.kafka.common.security.scram.ScramLoginModule required
   username="admin"
   password="5v1Gcqifu_kafka_admin_16chars";
};

KafkaClient {
   org.apache.kafka.common.security.scram.ScramLoginModule required
   username="admin"
   password="5v1Gcqifu_kafka_admin_16chars";
};

Client {
   org.apache.zookeeper.server.auth.DigestLoginModule required
   username="kafka"
   password="5v1Gcqifu_zk_kafka_16chars";
};

Server {
   org.apache.zookeeper.server.auth.DigestLoginModule required
   user_kafka="5v1Gcqifu_zk_kafka_16chars";
};
